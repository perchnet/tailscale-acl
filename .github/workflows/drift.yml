name: Detect drift

      # ------------------------------------------------------------------
      # Authenticate to Tailscale via OIDC workload identity federation.
      #
      # Prerequisites (one-time setup in the Tailscale admin console):
      #   1. Create a federated identity (Trust credentials → OpenID Connect)
      #      with GitHub as the issuer.
      #   2. Subject: "repo:${ORG}/tailscale-acl:*" (or narrower).
      #   3. Scopes: all:read  (or at minimum policy_file:read plus its
      #      required dependencies devices:core:read and
      #      devices:posture_attributes:read).
      #   4. Copy the generated Client ID and Audience.
      #
      # In GitHub, create repository *variables* (not secrets — the client
      # ID and audience are not sensitive):
      #   - TS_OIDC_CLIENT_ID  → the federated identity Client ID
      #   - TS_OIDC_AUDIENCE   → the audience (e.g. api.tailscale.com/<id>)
      #   - TS_TAILNET         → your tailnet name
      # ------------------------------------------------------------------
permissions:
  id-token: write # necessary to mint an OIDC token for Tailscale trust federation
  contents: write # necessary to push branches
  pull-requests: write # necessary to open the PR

env:
  POLICY_FILE: policy.hujson
  BRANCH_NAME: drift-reconciliation
on:
  push:
    paths:
      - '.github/workflows/drift.yml' # re-run if we update this file
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  acls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: id_token
        name: Request an OIDC token from GitHub
        env:
          TS_OIDC_AUDIENCE: ${{ vars.TS_OIDC_AUDIENCE }}
        run: |
          id_token="$(
            curl --silent --show-error --fail \
              --variable '%ACTIONS_ID_TOKEN_REQUEST_TOKEN' \
              --variable '%ACTIONS_ID_TOKEN_REQUEST_URL' \
              --variable '%TS_OIDC_AUDIENCE' \
              --expand-header "Authorization: bearer {{ACTIONS_ID_TOKEN_REQUEST_TOKEN}}" \
              --expand-url "{{ACTIONS_ID_TOKEN_REQUEST_URL}}&audience={{TS_OIDC_AUDIENCE}}" \
            | jq --raw-output --exit-status '.value'
          )"
          echo "::add-mask::${id_token}" # Mask the token in the logs to prevent accidental exposure.
          echo "id_token=${id_token}" >> "$GITHUB_OUTPUT" # Expose the token to subsequent steps.

      - name: Authenticate to Tailscale via OIDC
        id: authenticate
        env:
          TS_OIDC_CLIENT_ID: ${{ vars.TS_OIDC_CLIENT_ID }}
          JWT: ${{ steps.id_token.outputs.id_token }}
          TS_TOKEN_EXCHANGE_URL: https://api.tailscale.com/api/v2/oauth/token-exchange
        run: |
          api_token="$(
            curl --silent --show-error --fail \
              --header 'Content-Type: application/x-www-form-urlencoded' \
              --variable '%TS_OIDC_CLIENT_ID' \
              --variable '%JWT' \
              --variable '%TS_TOKEN_EXCHANGE_URL' \
              --expand-data 'client_id={{TS_OIDC_CLIENT_ID}}' \
              --expand-data 'jwt={{JWT}}' \
              --expand-url '{{TS_TOKEN_EXCHANGE_URL}}' \
              | jq --raw-output --exit-status '.access_token'
          )"
          echo "::add-mask::${api_token}" # Mask the token in the logs to prevent accidental exposure.
          echo "tailscale_api_token=${api_token}" >> "$GITHUB_OUTPUT" # Expose the token to subsequent steps.

      - name: Get current ACL policy from Tailscale
        id: get_policy
        env:
          TS_TOKEN: '${{ steps.authenticate.outputs.tailscale_api_token }}'
          REQUEST_URL: 'https://api.tailscale.com/api/v2/tailnet/${{ vars.TS_TAILNET }}/acl'
        run: |
          > ${{ env.POLICY_FILE }} \
            curl --silent --show-error --fail \
            --variable '%TS_TOKEN' \
            --variable '%REQUEST_URL' \
            --expand-header "Authorization: Bearer {{TS_TOKEN}}" \
            --expand-url '{{REQUEST_URL}}' \
          | perl -pe 'chomp if eof' # remove the spurious extra newline

      - name: Check for ACL drift
        id: check_drift
        run: |
          if git diff --exit-code ${{ env.POLICY_FILE }}; then
            echo "No ACL drift detected."
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
          else
            echo "ACL drift detected."
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: ${{ env.POLICY_FILE }} # only add the policy file to the PR
          commit-message: "Detect ACL drift"
          title: "Detect ACL drift"
          body: |
            This pull request was automatically generated by the GitHub Actions workflow.
            It contains the latest ACL policy fetched from Tailscale.
          base: ${{ github.event.repository.default_branch }}
          branch: ${{ env.BRANCH_NAME }}
          delete-branch: true # this will delete the branch if the policy is unchanged (i.e. if the ACL was manually reconciled) https://github.com/peter-evans/create-pull-request/tree/v8#delete-branch
          labels: drift-detection

      - name: Write summary
        id: summary
        env:
          PULL_REQUEST_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          DRIFT_DETECTED: ${{ steps.check_drift.outputs.drift_detected }}
        run: |
          case "${DRIFT_DETECTED}" in
            false)
            >>${GITHUB_STEP_SUMMARY} tee << 'EOM'
          [!NOTE]
          No ACL drift detected.
          EOM
              ;;
            true)
            >>${GITHUB_STEP_SUMMARY} tee << 'EOM'
          [!WARNING]
          ACL drift detected.
          EOM
              ;;
            *)
            >>${GITHUB_STEP_SUMMARY} tee << EOM
          Error: Unexpected value for DRIFT_DETECTED: ${DRIFT_DETECTED}"
              exit 1
              ;;
          esac

          case "${PULL_REQUEST_OPERATION}" in
            created)
            >>${GITHUB_STEP_SUMMARY} cat << 'EOM'
          A pull request has been created to reconcile the ACL drift. Please review and merge it.
          EOM
              ;;
            updated)
            >>${GITHUB_STEP_SUMMARY} cat << 'EOM'
          [!IMPORTANT]
          An existing drift-reconciliation pull request has been updated.
          EOM
              ;;
            closed)
            >>${GITHUB_STEP_SUMMARY} cat << 'EOM'
          [!NOTE]
          The pull request has been closed. If the ACL drift was reconciled, no further action is needed.
          EOM
              ;;
            none)
            >>${GITHUB_STEP_SUMMARY} cat << 'EOM'
          EOM
              ;;
            *)
            >>${GITHUB_STEP_SUMMARY} cat << EOM
          Error: Unexpected value for PULL_REQUEST_OPERATION: ${PULL_REQUEST_OPERATION}"
          EOM
              exit 1
              ;;
          esac