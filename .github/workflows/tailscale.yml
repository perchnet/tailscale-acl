name: Sync Tailscale ACLs

# These permissions are required for Tailscale workload identity federation.
# `id-token: write` lets GitHub mint an OIDC JWT at runtime; no long-lived
# secrets are stored in the repository.
permissions:
  contents: write
  id-token: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/drift.yml' # don't trigger this workflow when we update the drift-reconciliation one.
      - '**/*.md' # ignore any markdown files
    
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  acls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
      - name: Checkout (pull request)
        uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Format files
        run: ./reformat.sh
      - uses: EndBug/add-and-commit@v11
        with:
          message: 'chore: automatic reformat'
          default_author: 'github_actions'

      - name: Deploy ACL
        if: (github.event_name == 'push' || github.event_name == 'merge_group')
        id: deploy-acl
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tailnet: ${{ vars.TS_TAILNET }}
          action: apply

      - name: Test ACL
        if: github.event_name == 'pull_request'
        id: test-acl
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tailnet: ${{ vars.TS_TAILNET }}
          action: test
